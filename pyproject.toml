[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinescript-walkforward"
version = "0.1.0"
description = "Pine Script strategy templates with a Python walk-forward validation companion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "baronguyen001" }]
keywords = ["pinescript", "tradingview", "walk-forward", "backtesting"]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = [
  "mypy>=1.10",
  "nbstripout>=0.7",
  "papermill>=2.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
pinewf = "pinewf.cli:main"

[project.urls]
Homepage = "https://github.com/baronguyen001/pinescript-strategy-template"
Issues = "https://github.com/baronguyen001/pinescript-strategy-template/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pinewf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["pinewf"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
